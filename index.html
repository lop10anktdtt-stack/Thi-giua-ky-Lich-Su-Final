        // Helpers
        function normalizeText(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function gradeEssay(userText, keywords) {
            const normUserText = normalizeText(userText);
            let matchedCount = 0;
            let missingFeedback = [];
            keywords.forEach(kwGroup => {
                let matched = false;
                for (let word of kwGroup.words) {
                    if (normUserText.includes(normalizeText(word))) {
                        matched = true;
                        break;
                    }
                }
                if (matched) {
                    matchedCount++;
                } else {
                    missingFeedback.push(kwGroup.description);
                }
            });
            return { score: matchedCount, maxScore: keywords.length, missingFeedback };
        }

                score: score,

                partName: partName,
                timestamp: Date.now()
            };
            state.historyData.unshift(newEntry);
            localStorage.setItem('quiz_history_data', JSON.stringify(state.historyData));

                                    <h3 class="font-bold text-slate-800">Phần II: Trắc nghiệm Đúng/Sai</h3>

                            <button onclick="selectPart('part3')" class="w-full p-4 bg-white hover:bg-purple-50 border-2 border-slate-200 hover:border-purple-400 text-left rounded-xl transition-all flex items-center gap-4 group">
                                <div class="p-3 bg-purple-100 text-purple-600 rounded-lg group-hover:scale-110 transition-transform"><i data-lucide="pen-tool"></i></div>
                                <div>
                                    <h3 class="font-bold text-slate-800">Phần III: Tự luận (Chấm máy)</h3>
                                    <p class="text-sm text-slate-500">Học thuộc & Luyện tập viết bài tự luận.</p>
                                </div>
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.screen === 'range_select') {
                container.innerHTML = `
                    <div class="p-6 sm:p-8 space-y-6">
                        <button onclick="setScreen('part_select')" class="text-slate-400 hover:text-slate-600 font-medium text-sm">← Quay lại chọn phần</button>
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Chọn chế độ làm bài</h2>
                            <p class="text-slate-500 text-sm">Tổng số câu hỏi trong ngân hàng: 40 câu</p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <button onclick="handleMcqRangeSelect('all')" class="p-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md transition-all text-left">
                                <div class="text-lg">Tất cả 40 câu</div>
                                <div class="text-xs font-normal opacity-80">Làm toàn bộ từ câu 1 đến 40</div>
                            </button>
                            <button onclick="handleMcqRangeSelect('shuffle')" class="p-4 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold shadow-md transition-all text-left">
                                <div class="text-lg">Trộn câu hỏi</div>
                                <div class="text-xs font-normal opacity-80">Xáo trộn ngẫu nhiên thứ tự câu</div>
                            </button>
                            <button onclick="handleMcqRangeSelect('slice', 0, 20)" class="p-4 bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-700 rounded-xl font-bold transition-all text-left">
                                <div class="text-lg">20 câu đầu</div>
                                <div class="text-xs font-normal text-slate-400">Từ câu 1 đến câu 20</div>
                            </button>
                            <button onclick="handleMcqRangeSelect('slice', 20, 40)" class="p-4 bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-700 rounded-xl font-bold transition-all text-left">
                                <div class="text-lg">20 câu sau</div>
                                <div class="text-xs font-normal text-slate-400">Từ câu 21 đến câu 40</div>
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.screen === 'quiz_mcq') {
                const currentQ = state.activeQuizData[state.currentQuestionIndex];
                const selectedAnswer = state.mcqAnswers[state.currentQuestionIndex];
                const isAnswered = selectedAnswer !== undefined;

                container.innerHTML = `
                    <div class="flex flex-col h-full min-h-[550px]">
                        <!-- Top Header -->
                        <div class="p-4 bg-blue-600 text-white flex items-center justify-between">
                            <div>
                                <span class="text-xs uppercase tracking-wider opacity-80 font-bold">Phần I: Trắc nghiệm</span>
                                <p class="font-bold text-sm">${state.playerName}</p>
                            </div>
                            <span class="text-sm font-bold bg-white/20 px-3 py-1 rounded-full">
                                Câu ${state.currentQuestionIndex + 1} / ${state.activeQuizData.length}
                            </span>
                            <button onclick="setScreen('home')" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg font-bold">Thoát</button>
                        </div>

                        <!-- Question Content -->
                        <div class="p-6 overflow-y-auto space-y-5 flex-1 custom-scrollbar">
                            <h2 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">
                                ${currentQ.question}
                            </h2>

                            <div class="space-y-3">
                                ${currentQ.options.map((opt, idx) => {
                                    let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all flex items-start gap-3 relative font-medium text-sm sm:text-base ";
                                    if (!isAnswered) {
                                        btnClass += "bg-white border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-700 cursor-pointer";
                                    } else {
                                        if (idx === currentQ.answerIndex) {
                                            btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800 font-bold shadow-sm";
                                        } else if (idx === selectedAnswer && idx !== currentQ.answerIndex) {
                                            btnClass += "bg-rose-50 border-rose-500 text-rose-800 font-bold";
                                        } else {
                                            btnClass += "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                                        }
                                    }
                                    return `
                                        <button onclick="handleMcqClick(${idx})" class="${btnClass}">
                                            <span>${opt}</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- Footer Controls -->
                        <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                            <button onclick="prevQuestion()" ${state.currentQuestionIndex === 0 ? 'disabled' : ''} class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold text-sm disabled:opacity-40">
                                Câu trước
                            </button>
                            <button onclick="nextQuestion()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm shadow-md">
                                ${state.currentQuestionIndex < state.activeQuizData.length - 1 ? 'Câu tiếp theo' : 'Nộp bài'}
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.screen === 'quiz_tf') {
                const currentQ = state.activeQuizData[state.currentQuestionIndex];
                const currentAnswers = state.tfAnswers[state.currentQuestionIndex] || {};

                container.innerHTML = `
                    <div class="flex flex-col h-full min-h-[550px]">
                        <div class="p-4 bg-emerald-600 text-white flex items-center justify-between">
                            <div>
                                <span class="text-xs uppercase tracking-wider opacity-80 font-bold">Phần II: Đúng / Sai</span>
                                <p class="font-bold text-sm">${state.playerName}</p>
                            </div>
                            <span class="text-sm font-bold bg-white/20 px-3 py-1 rounded-full">
                                Đoạn ${state.currentQuestionIndex + 1} / ${state.activeQuizData.length}
                            </span>
                            <button onclick="setScreen('home')" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg font-bold">Thoát</button>
                        </div>

                        <div class="p-6 overflow-y-auto space-y-5 flex-1 custom-scrollbar">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm leading-relaxed text-slate-700 whitespace-pre-line font-medium">
                                ${currentQ.context}
                            </div>

                            <div class="space-y-4">
                                ${currentQ.options.map((opt, optIdx) => {
                                    const answeredVal = currentAnswers[optIdx];
                                    const isAns = answeredVal !== undefined;

                                    const getBtnStyle = (btnVal) => {
                                        if (!isAns) return "bg-white border-slate-200 text-slate-600 hover:border-blue-400 hover:bg-blue-50";
                                        if (btnVal === opt.isTrue) return "bg-emerald-50 border-emerald-500 text-emerald-700 font-bold shadow-sm";
                                        if (btnVal === answeredVal && answeredVal !== opt.isTrue) return "bg-rose-50 border-rose-500 text-rose-700 font-bold shadow-sm";
                                        return "bg-slate-50 border-slate-100 text-slate-300 opacity-40 cursor-not-allowed";
                                    };

                                    return `
                                        <div class="p-4 bg-white border border-slate-200 rounded-xl space-y-3">
                                            <p class="text-sm font-semibold text-slate-800">${opt.text}</p>
                                            <div class="flex gap-3">
                                                <button onclick="handleTfClick(${optIdx}, true)" ${isAns ? 'disabled' : ''} class="flex-1 py-2 px-4 rounded-lg font-bold border-2 text-sm transition-all flex items-center justify-center gap-1 ${getBtnStyle(true)}">
                                                    ĐÚNG
                                                </button>
                                                <button onclick="handleTfClick(${optIdx}, false)" ${isAns ? 'disabled' : ''} class="flex-1 py-2 px-4 rounded-lg font-bold border-2 text-sm transition-all flex items-center justify-center gap-1 ${getBtnStyle(false)}">
                                                    SAI
                                                </button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                            <button onclick="prevQuestion()" ${state.currentQuestionIndex === 0 ? 'disabled' : ''} class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold text-sm disabled:opacity-40">
                                Đoạn trước
                            </button>
                            <button onclick="nextQuestion()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm shadow-md">
                                ${state.currentQuestionIndex < state.activeQuizData.length - 1 ? 'Đoạn tiếp theo' : 'Nộp bài'}
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.screen === 'result') {
                container.innerHTML = `
                    <div class="p-8 text-center space-y-6">
                        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full mx-auto flex items-center justify-center shadow-inner">
                            <i data-lucide="trophy" class="w-10 h-10"></i>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">Hoàn thành bài làm, ${state.playerName}!</h2>
                            <p class="text-slate-500 mt-1">Kết quả kiểm tra của bạn:</p>
                            <div class="text-5xl font-extrabold text-blue-600 my-4">${state.score} / ${state.maxScore}</div>
                        </div>
                        <div class="flex gap-4 max-w-sm mx-auto">
                            <button onclick="setScreen('history')" class="flex-1 py-3 px-4 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-xl font-bold transition-all">
                                Xem Lịch Sử
                            </button>
                            <button onclick="setScreen('part_select')" class="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md transition-all">
                                Làm Bài Khác
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.screen === 'history') {
                container.innerHTML = `
                    <div class="p-6 sm:p-8 space-y-6">
                        <div class="flex items-center justify-between">
                            <button onclick="setScreen('home')" class="text-slate-400 hover:text-slate-600 font-medium text-sm">← Về trang chủ</button>
                            <h2 class="text-lg font-bold text-slate-900">Lịch sử làm bài</h2>
                        </div>
                        <div class="space-y-3 max-h-96 overflow-y-auto custom-scrollbar">
                            ${state.historyData.length === 0 ? `
                                <p class="text-center text-slate-400 py-8">Chưa có kết quả làm bài nào được lưu.</p>
                            ` : state.historyData.map(item => `
                                <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center">
                                    <div>
                                        <p class="font-bold text-slate-800">${item.playerName} - <span class="text-blue-600">${item.partName}</span></p>
                                        <span class="text-xs text-slate-400">${new Date(item.timestamp).toLocaleString('vi-VN')}</span>
                                    </div>
                                    <div class="font-extrabold text-lg text-emerald-600">
                                        ${item.score} / ${item.maxScore}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (state.screen === 'essay_menu') {
                container.innerHTML = `
                    <div class="p-6 sm:p-8 space-y-6">
                        <button onclick="setScreen('part_select')" class="text-slate-400 hover:text-slate-600 font-medium text-sm">← Quay lại</button>
                        <h2 class="text-xl font-bold text-slate-900">Phần III: Ôn Luyện Tự Luận</h2>
                        <div class="space-y-4">
                            <button onclick="setScreen('essay_study')" class="w-full p-5 bg-white hover:bg-purple-50 border-2 border-slate-200 hover:border-purple-400 text-left rounded-xl transition-all flex items-center gap-4">
                                <div class="p-3 bg-purple-100 text-purple-600 rounded-lg"><i data-lucide="book-text"></i></div>
                                <div>
                                    <h3 class="font-bold text-slate-800">Tài liệu học thuộc (6 câu)</h3>
                                    <p class="text-sm text-slate-500">Xem câu hỏi & đáp án mẫu được cô đọng ngắn gọn.</p>
                                </div>
                            </button>
                            <button onclick="setScreen('essay_test_select')" class="w-full p-5 bg-white hover:bg-orange-50 border-2 border-slate-200 hover:border-orange-400 text-left rounded-xl transition-all flex items-center gap-4">
                                <div class="p-3 bg-orange-100 text-orange-600 rounded-lg"><i data-lucide="edit-3"></i></div>
                                <div>
                                    <h3 class="font-bold text-slate-800">Luyện tập gõ đáp án</h3>
                                    <p class="text-sm text-slate-500">Tự trả lời câu hỏi, máy sẽ quét ý chính và chấm điểm.</p>
                                </div>
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.screen === 'essay_study') {
                container.innerHTML = `
                    <div class="p-6 sm:p-8 space-y-6 max-h-[85vh] overflow-y-auto custom-scrollbar">
                        <button onclick="setScreen('essay_menu')" class="text-slate-400 hover:text-slate-600 font-medium text-sm">← Quay lại menu tự luận</button>
                        <h2 class="text-xl font-bold text-slate-900">Tài liệu ôn tập 6 câu tự luận</h2>
                        <div class="space-y-4">
                            ${essayData.map((item, idx) => `
                                <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                                    <h3 class="font-bold text-purple-700 text-sm">${item.question}</h3>
                                    <div class="text-sm text-slate-700 whitespace-pre-line bg-white p-3.5 rounded-lg border border-slate-200 shadow-sm leading-relaxed">${item.answer}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (state.screen === 'essay_test_select') {
                container.innerHTML = `
                    <div class="p-6 sm:p-8 space-y-6">
                        <button onclick="setScreen('essay_menu')" class="text-slate-400 hover:text-slate-600 font-medium text-sm">← Quay lại menu tự luận</button>
                        <h2 class="text-xl font-bold text-slate-900">Chọn câu tự luận muốn luyện tập</h2>
                        <div class="space-y-3 max-h-96 overflow-y-auto custom-scrollbar">
                            ${essayData.map((item, idx) => `
                                <button onclick="startEssayDo(${idx})" class="w-full text-left p-4 bg-white hover:bg-orange-50 border-2 border-slate-200 hover:border-orange-400 rounded-xl font-medium text-sm text-slate-800 transition-all shadow-sm">
                                    <strong class="text-orange-600">Câu ${idx + 1}:</strong> ${item.question}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (state.screen === 'essay_test_do') {
                const item = essayData[state.selectedEssayIdx];
                container.innerHTML = `
                    <div class="p-6 sm:p-8 space-y-5 max-h-[85vh] overflow-y-auto custom-scrollbar">
                        <button onclick="setScreen('essay_test_select')" class="text-slate-400 hover:text-slate-600 font-medium text-sm">← Chọn câu khác</button>
                        <div>
                            <span class="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1 rounded-full">Luyện gõ câu ${state.selectedEssayIdx + 1}</span>
                            <h3 class="text-base font-bold text-slate-900 mt-2">${item.question}</h3>
                        </div>

                        <textarea id="essay-input" rows="5" placeholder="Gõ câu trả lời của bạn ở đây..." 
                            class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm leading-relaxed">${state.essayAnswerText}</textarea>

                        <button onclick="submitEssayAnswer()" class="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-bold shadow-md transition-all">
                            Chấm bài tự luận
                        </button>

                        ${state.essayResult ? `
                            <div class="p-5 bg-white border-2 border-orange-200 rounded-xl space-y-3 mt-4">
                                <div class="flex justify-between items-center">
                                    <h4 class="font-bold text-slate-900">Kết quả đánh giá:</h4>
                                    <span class="text-lg font-extrabold text-orange-600">${state.essayResult.score} / ${state.essayResult.maxScore} ý chính</span>
                                </div>
                                ${state.essayResult.missingFeedback.length > 0 ? `
                                    <div class="text-xs text-rose-600 space-y-1 bg-rose-50 p-3 rounded-lg border border-rose-100">
                                        <p class="font-bold">Các ý còn thiếu / chưa chính xác:</p>
                                        <ul class="list-disc pl-4 space-y-1">
                                            ${state.essayResult.missingFeedback.map(fb => `<li>${fb}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : `
                                    <p class="text-xs font-bold text-emerald-600 bg-emerald-50 p-3 rounded-lg border border-emerald-100">🎉 Tuyệt vời! Bạn đã trả lời đúng đầy đủ các ý chính.</p>
                                `}
                                <div class="pt-2">
                                    <p class="text-xs font-bold text-slate-500">Đáp án chuẩn cô đọng:</p>
                                    <p class="text-xs text-slate-700 whitespace-pre-line bg-slate-50 p-3 rounded-lg border border-slate-200 mt-1">${item.answer}</p>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // Refresh Lucide Icons
            lucide.createIcons();
        }

        // Action Handlers
        function setScreen(scr) {
            state.screen = scr;
            render();
        }

        function handleNameSubmit() {
            const input = document.getElementById('player-name-input');
            const val = input ? input.value.trim() : state.playerName.trim();
            if (!val) {
                state.errorMsg = 'Vui lòng nhập tên của bạn trước khi tiếp tục!';
                render();
                return;
            }
            state.playerName = val;
            state.errorMsg = '';
            localStorage.setItem('quiz_player_name', val);
            setScreen('part_select');
        }

        function selectPart(part) {
            state.selectedPart = part;
            if (part === 'part1') {
                setScreen('range_select');
            } else if (part === 'part2') {
                state.activeQuizData = tfQuizData;
                startQuiz('quiz_tf', tfQuizData);
            } else if (part === 'part3') {
                setScreen('essay_menu');
            }
        }

        function handleMcqRangeSelect(mode, startIdx, endIdx) {
            let data = [];
            if (mode === 'shuffle') {
                data = shuffleArray(mcqQuizData);
            } else if (mode === 'all') {
                data = [...mcqQuizData];
            } else {
                data = mcqQuizData.slice(startIdx, endIdx);
            }
            state.activeQuizData = data;
            startQuiz('quiz_mcq', data);
        }

        function startQuiz(targetScreen, data) {
            state.currentQuestionIndex = 0;
            state.mcqAnswers = {};
            state.tfAnswers = {};
            state.score = 0;
            state.maxScore = targetScreen === 'quiz_mcq' ? data.length : data.length * 4;
            setScreen(targetScreen);
        }

        function handleMcqClick(index) {
            state.mcqAnswers[state.currentQuestionIndex] = index;
            render();
        }

        function handleTfClick(optIdx, boolVal) {
            if (!state.tfAnswers[state.currentQuestionIndex]) {
                state.tfAnswers[state.currentQuestionIndex] = {};
            }
            state.tfAnswers[state.currentQuestionIndex][optIdx] = boolVal;
            render();
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                render();
            }
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < state.activeQuizData.length - 1) {
                state.currentQuestionIndex++;
                render();
            } else {
                calculateFinalScore();
            }
        }

        function calculateFinalScore() {
            let finalScore = 0;
            if (state.selectedPart === 'part1') {
                state.activeQuizData.forEach((q, idx) => {
                    if (state.mcqAnswers[idx] === q.answerIndex) finalScore++;
                });
            } else {
                state.activeQuizData.forEach((q, qIdx) => {
                    q.options.forEach((opt, optIdx) => {
                        if (state.tfAnswers[qIdx]?.[optIdx] === opt.isTrue) finalScore++;
                    });
                });
            }
            state.score = finalScore;
            saveHistory(finalScore, state.maxScore, state.selectedPart === 'part1' ? 'Trắc nghiệm (4 lựa chọn)' : 'Đúng / Sai');
            setScreen('result');
        }

        function startEssayDo(idx) {
            state.selectedEssayIdx = idx;
            state.essayAnswerText = '';
            state.essayResult = null;
            setScreen('essay_test_do');
        }

        function submitEssayAnswer() {
            const textarea = document.getElementById('essay-input');
            const userText = textarea ? textarea.value : state.essayAnswerText;
            state.essayAnswerText = userText;
            const keywords = essayData[state.selectedEssayIdx].keywords;
            state.essayResult = gradeEssay(userText, keywords);
            render();
        }

        // Initial Render
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
